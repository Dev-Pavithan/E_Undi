<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eundi - Donation Management System">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eundi">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  
  <title>Eundi</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #12376E 0%, #1a4a8a 100%);
    }
    
    #flutter_container {
      width: 100%;
      height: 100%;
    }
  </style>

  <script>
    // Simple PWA detection (optional - just for information)
    window.isPWAInstalled = function() {
      return window.matchMedia('(display-mode: standalone)').matches || 
             window.navigator.standalone === true;
    };
    
    // Register Service Worker for offline support (optional)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('Service Worker registered');
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    }
  </script>
</head>
<body>
  <div id="flutter_container"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
