<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eundi - Donation Management System">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eundi">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  
  <title>Eundi</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #12376E 0%, #1a4a8a 100%);
    }
    
    #flutter_container {
      width: 100%;
      height: 100%;
    }
  </style>

  <script>
    let deferredPrompt;
    
    // Capture beforeinstallprompt event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA: Prompt Captured');
      // Dispatch event for Flutter to hear
      window.dispatchEvent(new Event('pwa_prompt_ready'));
    });

    // Install PWA function
    window.installPWA = async () => {
      console.log('PWA: Install requested. deferredPrompt is:', !!deferredPrompt);
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`PWA Outcome: ${outcome}`);
        deferredPrompt = null;
        return outcome === 'accepted';
      }
      return false;
    };

    // Check if PWA is already installed
    window.isPWAInstalled = () => {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      console.log('PWA: isInstalled check:', isStandalone);
      return isStandalone;
    };

    // Check if prompt is ready
    window.isPWAPromptReady = () => {
      const ready = !!deferredPrompt;
      console.log('PWA: isPromptReady:', ready);
      return ready;
    };

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          console.log('SW: Registered successfully with scope:', registration.scope);
        }, function(err) {
          console.log('SW: Registration failed:', err);
        });
      });
    }
    
    console.log('PWA: Ready');
  </script>
</head>
<body>
  <div id="flutter_container"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
