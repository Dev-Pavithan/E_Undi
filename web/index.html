<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eundi - Donation Management System">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eundi">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  
  <title>Eundi</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #12376E 0%, #1a4a8a 100%);
    }
    
    #flutter_container {
      width: 100%;
      height: 100%;
    }
  </style>

  <script>
    // PWA Installation Variables
    let deferredPrompt = null;
    let installPromptShown = false;
    
    const isLocalhost = location.hostname === 'localhost' || 
                        location.hostname === '127.0.0.1' || 
                        location.hostname === '';
    const isHTTPS = location.protocol === 'https:';
    
    // Check if PWA is already installed
    window.isPWAInstalled = function() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                          window.navigator.standalone === true;
      const isFullscreen = window.matchMedia('(display-mode: fullscreen)').matches;
      const installed = isStandalone || isFullscreen;
      console.log('PWA: isPWAInstalled:', installed);
      return installed;
    };
    
    // Check if installation prompt is available
    window.isPWAPromptAvailable = function() {
      if (isLocalhost) {
        console.log('PWA: isPWAPromptAvailable: true (localhost)');
        return true;
      }
      const available = deferredPrompt !== null && !window.isPWAInstalled();
      console.log('PWA: isPWAPromptAvailable:', available);
      return available;
    };
    
    // Install PWA function - returns appropriate status
    window.installPWA = function() {
      console.log('PWA: installPWA called');
      
      // Check if already installed
      if (window.isPWAInstalled()) {
        console.log('PWA: Already installed');
        return 'already_installed';
      }
      
      // For localhost - simulate installation
      if (isLocalhost) {
        console.log('PWA: Localhost simulation - installing');
        setTimeout(() => {
          console.log('PWA: Localhost simulation complete');
        }, 500);
        return 'installed';
      }
      
      // For real HTTPS installation
      if (deferredPrompt) {
        try {
          // Show the native install prompt
          deferredPrompt.prompt();
          
          // Wait for user choice
          deferredPrompt.userChoice.then((choiceResult) => {
            console.log('PWA: User choice:', choiceResult.outcome);
            deferredPrompt = null;
            
            if (choiceResult.outcome === 'accepted') {
              console.log('PWA: User accepted installation');
            } else {
              console.log('PWA: User dismissed installation');
            }
          }).catch((err) => {
            console.error('PWA: userChoice error:', err);
          });
          
          return 'installing';
        } catch (err) {
          console.error('PWA: prompt() error:', err);
          return 'error';
        }
      }
      
      // No prompt available
      console.log('PWA: No installation prompt available');
      return 'prompt_not_available';
    };
    
    // Listen for beforeinstallprompt event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA: beforeinstallprompt captured ✅');
    });
    
    // Listen for app installed event
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      installPromptShown = false;
      console.log('PWA: App installed successfully ✅');
      
      // Optional: Notify Flutter app about installation
      if (window.flutterAppInstalled) {
        window.flutterAppInstalled();
      }
    });
    
    // Register Service Worker for offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('Service Worker registered successfully:', registration.scope);
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    }
    
    // Log environment info
    console.log('PWA: Environment - HTTPS:', isHTTPS, 'Localhost:', isLocalhost);
    console.log('PWA: Ready for installation');
  </script>
</head>
<body>
  <div id="flutter_container"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
